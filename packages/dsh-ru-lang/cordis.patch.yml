# Слой профиля для плагина dsh-ru-lang.
#
# Бандл подключает сам себя: запись-вставка добавляет плагин в дерево Loader,
# плагин регистрирует язык `ru` и словари в клиентском locale-сервисе DSH.
# Ручная правка $DSH_HOME/profiles/*/cordis.patch.yml не нужна.
- insert:
    - id: ru-lang
      name: dsh-ru-lang
